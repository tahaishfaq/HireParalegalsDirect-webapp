<div class="modal-header position-relative">
    <h5 class="modal-title">Sign In</h5>
    <button type="button" class="close" aria-label="Close" (click)="dismiss()">
        <span aria-hidden="true">&times;</span>
    </button>
</div>

<div class="modal-body">
    <form (submit)="onLogin()">
        <div class="mb-3">
            <label for="email" class="form-label">Email or Username</label>
            <input type="text" class="form-control" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email or username">
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" [(ngModel)]="password" name="password" placeholder="Enter your password">
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>

    <!-- OR Separator -->
    <div class="text-center my-3">
        <hr>
        <span class="or-text">OR</span>
    </div>

    <!-- Social Login Buttons -->
    <div class="d-grid">
        <button class="btn btn-outline-danger w-100 mb-2" >
            <i class="fa fa-google mr-2"></i> Sign in with Google
        </button>
        <button class="btn btn-outline-primary w-100 mb-2">
            <i class="fa fa-facebook mr-2"></i> Sign in with Facebook
        </button>
        <button class="btn btn-outline-info w-100 mb-2">
            <i class="fa fa-linkedin mr-2"></i> Sign in with LinkedIn
        </button>
    </div>
</div>
