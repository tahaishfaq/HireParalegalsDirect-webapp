

<div class="container-fluid" style="padding-right: 0;padding-left: 0;">

    <div class="container-fluid py-md-5 py-3">
        
        <div class="container">
            <h2 class="heading1">
                Set password for paralegal profile
            </h2>
            <div class="row">
                <div class="col-lg-6 my-auto">
                    <div class="card shadow-lg p-4 w-100">
                        <div class="card-body align-self-center">
                            <div class="justify-items-center mt-3">
                                <div class="form-group">
                                    <label for="name">Email</label>
                                    <input type="email" class="form-control" [(ngModel)]="email"
                                    [readonly]="true" />
                                </div>
                                <div class="form-group">
                                    <label for="name">Password</label>
                                    <input type="password" class="form-control" [(ngModel)]="password"
                                    placeholder="Enter your email" required />
                                </div>
                                <button type="submit" class="btn btn-primary w-100" (click)="submitPassword()">Submit</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-lg-6 d-lg-block d-none">
                    <img class="image-right" src="/assets/img/female-lawyer.jpg" alt="Profile Search">
                </div>
            </div>
        </div>

    </div>


</div>
