<div class="modal-header">
    <h5 class="modal-title">Paralegal Sign-Up</h5>
    <button type="button" class="close" aria-label="Close" (click)="dismiss()">
        <span aria-hidden="true">&times;</span>
    </button>
</div>

<div class="modal-body">
    <form  #signUpForm="ngForm">
        <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullName" name="fullName" required placeholder="Enter your full name">
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" required placeholder="Enter your email">
        </div>

        <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" name="phone" required placeholder="Enter your phone number">
        </div>

        <div class="mb-3">
            <label for="practice" class="form-label">Area of Practice</label>
            <select class="form-control" id="practice" name="practice" required>
                <option value="">Select your practice area</option>
                <option value="Family Law">Family Law</option>
                <option value="Criminal Law">Criminal Law</option>
                <option value="Corporate Law">Corporate Law</option>
                <option value="Immigration Law">Immigration Law</option>
                <option value="Real Estate Law">Real Estate Law</option>
                <option value="Intellectual Property Law">Intellectual Property Law</option>
                <option value="Employment Law">Employment Law</option>
                <option value="Personal Injury Law">Personal Injury Law</option>
                <option value="Bankruptcy Law">Bankruptcy Law</option>
                <option value="Environmental Law">Environmental Law</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="location" class="form-label">Location</label>
            <input type="text" class="form-control" id="location" name="location" required placeholder="Enter your location">
        </div>

        <div class="mb-3">
            <label for="experience" class="form-label">Years of Experience</label>
            <input type="number" class="form-control" id="experience" name="experience" required min="0" placeholder="Enter your experience in years">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required placeholder="Enter a secure password">
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
        </div>

        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
            <label class="form-check-label" for="terms">I agree to the Terms and Conditions</label>
        </div>

        <button type="submit" class="btn btn-primary w-100">Sign Up</button>
    </form>
</div>
