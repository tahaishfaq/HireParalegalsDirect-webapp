<section id="regestration">
    <div class="row auth-height m-0">
      <div class="col-12 d-flex align-items-center">
        <div class="card overflow-hidden">
          <div class="card-content">
            <div class="card-body auth-img">
              <div class="row m-0">
                <div class="col-lg-6 d-none d-lg-flex justify-content-center align-items-center text-center auth-img-bg py-2">
                  <img src="/assets/img/forgot-password.svg" alt="" class="img-fluid" width="350" height="250">
                </div>
                <div class="col-lg-6 col-md-12 px-4 py-3 align-self-center">

                    <!-- OTP UI -->
                    <ng-container *ngIf="!isOtpVerified">
                      <div>
                        <h4 class="mb-2 card-title">Verify OTP</h4>
                        <p class="card-text mb-3">Please enter OTP, received at your provided email address.</p>
                        <input type="text" [(ngModel)]="otp" class="form-control mb-3" placeholder="OTP">
                        <div class="d-flex flex-sm-row flex-column justify-content-between">
                          <button (click)="verifyOtp()" class="btn btn-primary ml-sm-1">Verify</button>
                        </div>
                      </div>
                    </ng-container>
                  
                    <!-- Reset Password UI -->
                    <ng-container *ngIf="isOtpVerified">
                      <div @slideInRight>
                        <h4 class="mb-2 card-title">Reset Password</h4>
                        <p class="card-text mb-3">Please enter a new password for your account.</p>
                  
                        <!-- New Password -->
                        <div class="input-group mb-2">
                          <input [type]="showPassword ? 'text' : 'password'" [(ngModel)]="newPassword" class="form-control" placeholder="New Password">
                          <div class="input-group-append">
                            <button type="button" class="btn btn-outline-secondary" (click)="togglePassword()">
                              <i class="fa" [ngClass]="showPassword ? 'fa-eye' : 'fa-eye-slash'"></i>
                            </button>
                          </div>
                        </div>
                  
                        <!-- Submit -->
                        <div class="d-flex flex-sm-row flex-column justify-content-between">
                          <button (click)="resetPassword()" class="btn btn-success">Reset Password</button>
                        </div>
                      </div>
                    </ng-container>
                  
                  </div>
                  
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
